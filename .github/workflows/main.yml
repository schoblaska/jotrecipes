name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushes to GHCR as jotrecipes:main-<sha>-<unix-timestamp> and :latest on main.
# Flux on the homelab public box picks the highest timestamp and rolls it out,
# so a green run on main is a deploy (homelab repo: hosts/um890/apps/jotrecipes).
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test

  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Image tag
        id: meta
        run: echo "tag=main-${GITHUB_SHA::7}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/schoblaska/jotrecipes:${{ steps.meta.outputs.tag }}
            ghcr.io/schoblaska/jotrecipes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
